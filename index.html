<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">title</h1>
    <p id="description">description</p>
    <form id="survey-form">survey-form
      <input type="text" id="name" name="full-name" placeholder="Enter your full name" required>
      <input type="email" id="email" name="working-email" placeholder="Enter your email" required>
      <input type="number" id="number" min="20" max="40" placeholder="Enter your age">
      <label id="name-label">Full Name</label>
       <label id="email-label">Working Email</label>
      <label id="number-label">Age</label>
     <select id="dropdown">
     <option value="20">20</option>
     <option value="35">35</option>
<input type="radio" name="age" value="25">
<input type="radio" name="age" value="35">
<input type="checkbox" value="20">
<input type="checkbox" value="35">
<textarea></textarea>
<button id="submit" type="submit">Submit</button>          
    </form>
  </body>
</html>
